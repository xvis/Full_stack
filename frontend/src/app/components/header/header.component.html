<header class="site-header" role="banner">
  <div class="header-container">

    <!-- Brand -->
    <a class="brand" routerLink="/" aria-label="NexaFlow Home">
      <svg class="brand-icon" width="30" height="30" viewBox="0 0 30 30" fill="none" aria-hidden="true">
        <rect width="30" height="30" rx="8" fill="#2563EB"/>
        <path d="M8 15L13.5 20.5L22 10" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-name">NexaFlow</span>
      <span class="brand-badge">Enterprise</span>
    </a>

    <!-- Main Navigation -->
    <nav class="main-nav" aria-label="Main navigation">
      <a href="#" class="nav-item">{{ 'header.products' | translate }}</a>
      <a href="#" class="nav-item">{{ 'header.solutions' | translate }}</a>
      <a href="#" class="nav-item">{{ 'header.pricing' | translate }}</a>
      <a href="#" class="nav-item">{{ 'header.security' | translate }}</a>
    </nav>

    <!-- Header Actions -->
    <div class="header-actions">
      <a href="#" class="nav-link-plain">{{ 'header.documentation' | translate }}</a>
      <a href="#" class="btn-cta">{{ 'header.contactSales' | translate }}</a>
      <app-language-switcher></app-language-switcher>
    </div>

  </div>
</header>
