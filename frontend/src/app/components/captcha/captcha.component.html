<div class="captcha-wrap">

  <!-- Label -->
  <p class="captcha-label">{{ 'captcha.label' | translate }} <span class="captcha-req">*</span></p>

  <!-- Bordered box: canvas on top, divider, input+refresh row at bottom -->
  <div class="captcha-box"
       [class.box--error]="isError"
       [class.box--success]="isSuccess">

    <!-- Challenge canvas -->
    <div class="captcha-canvas-area">
      <canvas #captchaCanvas class="captcha-canvas" width="560" height="160"
              role="img" [attr.aria-label]="'captcha.label' | translate"></canvas>

      <!-- Success overlay -->
      <div *ngIf="isSuccess" class="captcha-success-overlay" aria-live="polite">
        <span class="captcha-check">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="white" stroke-width="3" aria-hidden="true">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </span>
        <span class="captcha-verified">{{ 'captcha.verified' | translate }}</span>
      </div>
    </div>

    <!-- Divider -->
    <div class="captcha-divider"></div>

    <!-- Input + Refresh in same row -->
    <div class="captcha-input-row">
      <input #captchaInput
             type="text"
             class="captcha-input"
             [value]="userInput"
             (input)="onInput($event)"
             [placeholder]="'captcha.placeholder' | translate"
             autocomplete="off"
             spellcheck="false"
             maxlength="6"
             [attr.aria-label]="'captcha.placeholder' | translate"/>
      <button type="button" class="captcha-refresh-btn"
              (click)="refresh()"
              [attr.aria-label]="'captcha.refresh' | translate">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.2" aria-hidden="true">
          <polyline points="23 4 23 10 17 10"/>
          <polyline points="1 20 1 14 7 14"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
      </button>
    </div>

  </div>

  <!-- Error message -->
  <p *ngIf="isError" class="captcha-error" role="alert">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="8" x2="12" y2="12"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    {{ 'captcha.incorrect' | translate }}
  </p>

</div>
