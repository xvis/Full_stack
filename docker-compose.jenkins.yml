services:
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: nexaflow-jenkins
    restart: unless-stopped
    user: root  # allows seamless access to mounted docker.sock on macOS Docker Desktop
    ports:
      - "8081:8080"
      - "50000:50000"
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=true
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - nexaflow-network

volumes:
  jenkins_data:
    name: nexaflow_jenkins_data

networks:
  nexaflow-network:
    name: fullstack_project_nexaflow-network
    external: true

