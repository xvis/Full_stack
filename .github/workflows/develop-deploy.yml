name: Build Docker Images

on:
  push:
    branches:
      - develop

jobs:

  docker:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Frontend
        run: |
          docker build \
          -t xvishu/fullstack-frontend:${{ github.sha }} \
          ./frontend

      - name: Push Frontend
        run: |
          docker push xvishu/fullstack-frontend:${{ github.sha }}

      - name: Build Backend
        run: |
          docker build \
          -t xvishu/fullstack-backend:${{ github.sha }} \
          ./backend

      - name: Push Backend
        run: |
          docker push xvishu/fullstack-backend:${{ github.sha }}